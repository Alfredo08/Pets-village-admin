<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Petsvillage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow">
                <div class="card-body">

                    <h3 class="text-center mb-4">Crear usuario</h3>

                    {% with mensajes = get_flashed_messages(category_filter=["registro"]) %}
                        {% if mensajes %}
                            {% for mensaje in mensajes %}
                                <div class="alert alert-danger">
                                    {{ mensaje }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="/registrar" method="POST">

                        <div class="mb-3">
                            <label>Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Correo</label>
                            <input type="email" name="correo" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Confirmar contraseña</label>
                            <input type="password" name="confirmar_password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Rol</label>
                            <select name="rol" class="form-select" required>
                                <option value="admin">Administrador</option>
                                <option value="recepcion">Recepción</option>
                                <option value="estilista">Estilista</option>
                            </select>
                        </div>

                        <button class="btn btn-success w-100">
                            Registrar
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/login">Volver al login</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
